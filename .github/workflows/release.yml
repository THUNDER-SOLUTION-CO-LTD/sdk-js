name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    name: Release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # tags and GitHub Releases
      pull-requests: write # the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
  publish:
    name: Publish to npm
    needs: release-please
    if: >-
      always() && (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Check tag matches package version
        run: test "$RELEASE_TAG" = "v$(bun -p 'require("./package.json").version')"
      - run: bun install --frozen-lockfile && bun run build
      # npm only for publishing: bun publish cannot generate provenance or use trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm publish --provenance --access public --ignore-scripts
